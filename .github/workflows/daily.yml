name: Daily MLB Update

# Runs at 3 AM, 11 AM, and 5 PM Eastern — every day during baseball season.
# Why these times:
#   3 AM  → West Coast games done by ~2 AM ET; safe to grade + run first slate
#   11 AM → catches day-game lineups (1 PM ET first pitch) + morning line movement
#   5 PM  → ~90% of night-game lineups confirmed; biggest accuracy boost of the day
#
# Schedules below are in UTC because GitHub Actions doesn't support TZ directly.
#   - 7:00 UTC  = 3 AM ET (DST, March-November)
#   - 8:00 UTC  = 3 AM ET (Standard time, November-March)
#   - 15:00 UTC = 11 AM ET (DST)
#   - 16:00 UTC = 11 AM ET (Standard)
#   - 21:00 UTC = 5 PM ET (DST)
#   - 22:00 UTC = 5 PM ET (Standard)
# All six are listed so the schedule is correct year-round. The pipeline is
# idempotent (drop_duplicates on game_pk; player snapshots skipped if present),
# so extra firings during DST transition weeks are harmless.
on:
  schedule:
    # Offset 7 min from hour boundary — GitHub Actions is most congested
    # at exact :00 UTC, so :07 reliably fires while staying ~3 AM/11 AM/5 PM ET.
    - cron: '7 7 * * *'    # 3:07 AM ET (DST)
    - cron: '7 8 * * *'    # 3:07 AM ET (Standard)
    - cron: '7 15 * * *'   # 11:07 AM ET (DST)
    - cron: '7 16 * * *'   # 11:07 AM ET (Standard)
    - cron: '7 21 * * *'   # 5:07 PM ET (DST)
    - cron: '7 22 * * *'   # 5:07 PM ET (Standard)
    # Extra ticks. GitHub starts scheduled runs on a best-effort basis and has
    # been starting these 4-6 hours late, which left the site on yesterday's
    # slate all morning. More ticks = a fresh run lands more often; each run is
    # idempotent. The evening runs (after 3 PM ET) also write tomorrow's slate
    # (next_day_*.csv), which the site serves from midnight ET until the day's
    # first run lands.
    - cron: '23 4 * * *'   # 12:23 AM ET (DST)
    - cron: '23 10 * * *'  # 6:23 AM ET (DST)
    - cron: '23 12 * * *'  # 8:23 AM ET (DST)
    - cron: '23 18 * * *'  # 2:23 PM ET (DST)
    - cron: '23 0 * * *'   # 8:23 PM ET (DST)
  workflow_dispatch:        # allows you to trigger manually from the Actions tab

concurrency:                # one run at a time; queued ticks wait instead of racing the commit
  group: daily-update
  cancel-in-progress: false

permissions:
  contents: write           # required to commit the updated CSVs back to the repo

jobs:
  update:
    runs-on: ubuntu-latest
    # Bumped 25 → 90 minutes. The first run after deploying the data refresh
    # has to:
    #   - pull ~2 months of 2026 Statcast (~150K pitches, ~5–10 min)
    #   - rebuild per-game features (~2 min)
    #   - backfill ~35 days of player projection snapshots (~20–30 min)
    #   - grade them all against the MLB Stats API (~5–10 min)
    # Once the pitch cache is warm and snapshots exist, daily runs are <10 min.
    timeout-minutes: 150

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Statcast caches (pitch_data_<season>.csv, written by refresh_full_history.py).
      #   * The two PREVIOUS seasons are immutable once complete: a stable key
      #     means they are downloaded on the first run of a season and restored
      #     from cache on every run after that (never re-pulled daily).
      #   * The CURRENT season is topped up incrementally each run; a rolling
      #     key saves the updated file, restore-keys falls back to the last one.
      #   * data/features holds the windowed multi-season feature tables so the
      #     daily build only recomputes the current season's window.
      - name: Resolve season
        run: |
          Y=$(TZ=America/New_York date +%Y)
          echo "SEASON=$Y" >> "$GITHUB_ENV"
          echo "PREV1=$((Y-1))" >> "$GITHUB_ENV"
          echo "PREV2=$((Y-2))" >> "$GITHUB_ENV"

      - name: Cache Statcast history seasons (previous two)
        uses: actions/cache@v4
        with:
          path: |
            pitch_data_${{ env.PREV2 }}.csv
            pitch_data_${{ env.PREV1 }}.csv
          key: statcast-history-v1-${{ env.SEASON }}

      - name: Cache current-season Statcast + feature tables
        uses: actions/cache@v4
        with:
          path: |
            pitch_data_${{ env.SEASON }}.csv
            data/features
          key: statcast-current-v1-${{ env.SEASON }}-${{ github.run_id }}
          restore-keys: |
            statcast-current-v1-${{ env.SEASON }}-

      # daily_update.py is the SINGLE entry point. It runs:
      #   0. Statcast refresh (2 history seasons + current) → windowed feature build
      #   1. Game-pick backfill
      #   2. Today's game model (win-probability projections)
      #   3. Game grading
      #   4. Player snapshot backfill
      #   5. Today's player projections
      #   6. Player projection grading
      #   7. Calibration rebuild + apply
      #   8. Player power rankings rebuild
      - name: Run daily pipeline (data refresh + games + players)
        run: python daily_update.py

      - name: Commit fresh outputs
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # Stage every artifact the pipeline can touch:
          #   data/                        → refreshed 2026 per-game features (LFS)
          #   models/                      → trained model PKL files
          #   outputs/                     → today's predictions, dated snapshots, power rankings
          #   2026_picks_accuracy.csv      → game projection log
          #   2026_player_accuracy.csv     → player projection vs actual log
          #   calibration.json             → live bias-correction block
          # Statcast CSV caches + data/features are gitignored (too large for
          # git); they live in the GitHub Actions cache instead.
          # Stage everything that exists — some files are only written once
          # grading has actuals, so we add them only if present, otherwise
          # `git add <missing>` exits non-zero and aborts the commit even
          # when the rest of the pipeline succeeded.
          git add data/ models/ outputs/ || true
          for f in \
            2026_picks_accuracy.csv \
            2026_player_accuracy.csv \
            calibration.json; do
            if [ -f "$f" ]; then
              git add "$f"
            else
              echo "  (skipping $f — not present yet)"
            fi
          done

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Daily update — $(date -u +'%Y-%m-%d %H:%M UTC')"

          # Retry on race conditions — if the user pushed while we were
          # running, rebase our data commit on top with `-X theirs` so the
          # cron's freshly-generated CSVs always win.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push rejected on attempt $attempt; rebasing on origin/main..."
            git fetch origin main
            if ! git rebase -X theirs origin/main; then
              echo "Rebase failed; aborting and retrying..."
              git rebase --abort || true
            fi
            sleep $((attempt * 3))
          done
          echo "Failed to push after 5 attempts"
          exit 1
